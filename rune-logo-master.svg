<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1254 1254"
     width="1254"
     height="1254"
     role="img"
     aria-labelledby="rune-title rune-desc">
  <title id="rune-title">RUNE logo</title>
  <desc id="rune-desc">A minimal geometric RUNE monogram formed from three angular shapes and negative space.</desc>

  <!--
    RUNE — master logo
    Rebuilt from the approved 1:1 concept.

    Construction:
    • 3 polygons only
    • transparent background
    • no strokes
    • no gradients
    • no masks
    • no raster image
    • the R is true negative space

    Change --rune-mark to recolor the entire logo.
  -->
  <style>
    :root { --rune-mark: #171717; }
  </style>

  <g fill="var(--rune-mark)">
    <!-- Crown + right shell -->
    <path d="
      M 628 156
      L 259 373
      L 750 373
      L 914 538
      L 750 710
      L 927 905
      L 997 858
      L 997 370
      Z" />

    <!-- Left pillar -->
    <path d="
      M 259 373
      L 439 491
      L 438 982
      L 259 858
      Z" />

    <!-- Inner rune + descending leg -->
    <path d="
      M 758 511
      L 541 511
      L 541 1050
      L 626 1107
      L 857 953
      L 544 736
      Z" />
  </g>
</svg>
